<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Progress Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #ffa116;
            font-size: 2rem;
        }
        .summary-bar {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
            color: #aaa;
        }
        .summary-bar span { color: #ffa116; font-weight: bold; }
        .progress-overview {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
            border: 1px solid #0f3460;
        }
        .stat-card .number { font-size: 1.8rem; color: #ffa116; font-weight: bold; }
        .stat-card .label { font-size: 0.8rem; color: #888; margin-top: 5px; }
        .category {
            background: #16213e;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
            overflow: hidden;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0f3460;
            cursor: pointer;
            user-select: none;
        }
        .category-header:hover { background: #1a4a8a; }
        .category-header h2 { font-size: 1.1rem; color: #fff; }
        .category-progress {
            font-size: 0.85rem;
            color: #ffa116;
        }
        .progress-bar-bg {
            height: 4px;
            background: #1a1a2e;
            margin-top: 8px;
            border-radius: 2px;
        }
        .progress-bar-fill {
            height: 100%;
            background: #ffa116;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .problems-list {
            padding: 0;
            display: none;
        }
        .problems-list.open { display: block; }
        .problem-row {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #0f3460;
            transition: background 0.2s;
        }
        .problem-row:last-child { border-bottom: none; }
        .problem-row:hover { background: #1a2a4e; }
        .problem-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #ffa116;
        }
        .problem-info { flex: 1; }
        .problem-name { font-size: 0.95rem; }
        .problem-name a {
            color: #ddd;
            text-decoration: none;
        }
        .problem-name a:hover { color: #ffa116; text-decoration: underline; }
        .problem-number { color: #888; margin-right: 8px; font-size: 0.85rem; }
        .difficulty {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .easy { background: #1b4332; color: #52c41a; }
        .medium { background: #3d2e00; color: #ffa116; }
        .hard { background: #3d0000; color: #ff4d4f; }
        .solved .problem-name a { color: #52c41a; text-decoration: line-through; }
        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #0f3460;
            background: #16213e;
            color: #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #ffa116;
            color: #1a1a2e;
            border-color: #ffa116;
        }
        .date-input {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            width: 100px;
            margin-left: 10px;
        }
        .date-input:focus { outline: none; border-color: #ffa116; }
    </style>
</head>

    // Load saved state from localStorage
    function loadState() {
        const saved = localStorage.getItem('leetcode_tracker');
        if (saved) {
            const state = JSON.parse(saved);
            problemsData.forEach(p => {
                const key = `${p.id}`;
                if (state[key]) {
                    p.solved = state[key].solved;
                    p.date = state[key].date || '';
                }
            });
        }
    }

    // Save state to localStorage
    function saveState() {
        const state = {};
        problemsData.forEach(p => {
            state[`${p.id}`] = { solved: p.solved, date: p.date || '' };
        });
        localStorage.setItem('leetcode_tracker', JSON.stringify(state));
    }

    function updateStats() {
        const solved = problemsData.filter(p => p.solved);
        document.getElementById('totalSolved').textContent = solved.length;
        document.getElementById('totalProblems').textContent = problemsData.length;
        document.getElementById('easySolved').textContent = solved.filter(p => p.difficulty === 'easy').length;
        document.getElementById('mediumSolved').textContent = solved.filter(p => p.difficulty === 'medium').length;
        document.getElementById('hardSolved').textContent = solved.filter(p => p.difficulty === 'hard').length;

        // Calculate streak
        const dates = solved.map(p => p.date).filter(d => d).sort().reverse();
        let streak = 0;
        if (dates.length > 0) {
            const today = new Date().toISOString().split('T')[0];
            let checkDate = new Date(today);
            for (let i = 0; i < 365; i++) {
                const dateStr = checkDate.toISOString().split('T')[0];
                if (dates.includes(dateStr)) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else if (i === 0) {
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    break;
                }
            }
        }
        document.getElementById('streakCount').textContent = streak;
    }

    function render(filter = 'all') {
        const container = document.getElementById('categories');
        container.innerHTML = '';

        const categories = [...new Set(problemsData.map(p => p.category))];

        categories.forEach(cat => {
            let problems = problemsData.filter(p => p.category === cat);

            // Apply filter
            if (filter === 'solved') problems = problems.filter(p => p.solved);
            else if (filter === 'unsolved') problems = problems.filter(p => !p.solved);
            else if (['easy', 'medium', 'hard'].includes(filter)) problems = problems.filter(p => p.difficulty === filter);

            if (problems.length === 0) return;

            const allInCat = problemsData.filter(p => p.category === cat);
            const solvedInCat = allInCat.filter(p => p.solved).length;
            const pct = Math.round((solvedInCat / allInCat.length) * 100);

            const catDiv = document.createElement('div');
            catDiv.className = 'category';
            catDiv.innerHTML = `
                <div class="category-header" onclick="this.nextElementSibling.classList.toggle('open')">
                    <h2>${cat}</h2>
                    <div>
                        <span class="category-progress">${solvedInCat}/${allInCat.length}</span>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width:${pct}%"></div>
                        </div>
                    </div>
                </div>
                <div class="problems-list${cat === 'Arrays & Hashing' ? ' open' : ''}">
                    ${problems.map(p => `
                        <div class="problem-row ${p.solved ? 'solved' : ''}" data-difficulty="${p.difficulty}">
                            <input type="checkbox" ${p.solved ? 'checked' : ''} onchange="toggleSolved(${p.id}, this.checked)">
                            <div class="problem-info">
                                <span class="problem-name">
                                    <span class="problem-number">#${p.id}</span>
                                    <a href="https://leetcode.com/problems/${p.name.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/ +/g,'-')}" target="_blank">${p.name}</a>
                                </span>
                            </div>
                            <input type="date" class="date-input" value="${p.date || ''}" onchange="setDate(${p.id}, this.value)">
                            <span class="difficulty ${p.difficulty}">${p.difficulty}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(catDiv);
        });

        updateStats();
    }

    function toggleSolved(id, checked) {
        const problem = problemsData.find(p => p.id === id);
        problem.solved = checked;
        if (checked && !problem.date) {
            problem.date = new Date().toISOString().split('T')[0];
        }
        saveState();
        render(currentFilter);
    }

    function setDate(id, date) {
        const problem = problemsData.find(p => p.id === id);
        problem.date = date;
        saveState();
    }

    let currentFilter = 'all';
    function filterProblems(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        render(filter);
    }

    // Initialize
    loadState();
    render();
    </script>
